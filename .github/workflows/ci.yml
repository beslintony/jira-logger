name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build config package
        run: pnpm --filter @jira-logger/config exec tsc

      - name: Build parsers package
        run: pnpm --filter @jira-logger/parsers exec tsc

      - name: Build jira-api package
        run: pnpm --filter @jira-logger/jira-api exec tsc

      - name: Build core package
        run: pnpm --filter @jira-logger/core exec tsc --build

      - name: Build cli package
        run: pnpm --filter @jira-logger/cli exec tsc --build

      - name: Type check config
        run: pnpm --filter @jira-logger/config exec tsc --noEmit

      - name: Type check parsers
        run: pnpm --filter @jira-logger/parsers exec tsc --noEmit

      - name: Type check jira-api
        run: pnpm --filter @jira-logger/jira-api exec tsc --noEmit

      - name: Type check core
        run: pnpm --filter @jira-logger/core exec tsc --noEmit

      - name: Type check cli
        run: pnpm --filter @jira-logger/cli exec tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 20
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
